<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="seckert: el proceso justo para cada pedido">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="0.55" stop-color="#2a1250"/>
      <stop offset="1" stop-color="#0f2a3d"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd2e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-4" fill="url(#word)">seckert</text>
  <text x="84" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#e8defc">El proceso justo para cada pedido.</text>
  <text x="84" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#b9a8e6">Plugin personal de Claude Code</text>

  <!-- tres rutas: cuánto proceso según el pedido -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff">
    <path d="M700 160 C 740 160, 740 90, 790 90" fill="none" stroke="#8b7bff" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M700 160 L 790 160" fill="none" stroke="#8b7bff" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M700 160 C 740 160, 740 230, 790 230" fill="none" stroke="#8b7bff" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="700" cy="160" r="12" fill="#8b7bff"/>

    <rect x="790" y="66" width="150" height="48" rx="24" fill="#14806b"/>
    <text x="865" y="98" text-anchor="middle">FIX</text>

    <rect x="790" y="136" width="220" height="48" rx="24" fill="#2f5fd0"/>
    <text x="900" y="168" text-anchor="middle">SPEC</text>

    <rect x="790" y="206" width="320" height="48" rx="24" fill="#b0306f"/>
    <text x="950" y="238" text-anchor="middle">CHANGE</text>
  </g>
</svg>
